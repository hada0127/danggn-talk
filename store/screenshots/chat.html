<!doctype html>
<!-- 스토어 스크린샷용 목업: 가짜 대화 + 실제 확장 CSS/스크립트(chrome API 는 아래에서 흉내). 패키지에 안 들어감. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../themes/kakao.css">
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#212124}
  body{background:#fff}
  .shell{height:100vh}
  main.body{display:flex;height:100vh}
  main.body>div{display:flex;flex:1}
  section{display:flex;flex-direction:column;flex:1;min-width:0;background:#fff}
  .chat-normal-room{display:flex;flex-direction:column;width:100%;height:100%}
  .hdr{display:flex;align-items:center;justify-content:space-between;height:64px;min-height:64px;padding:0 20px;border-bottom:1px solid #eaebee}
  .group-title{font-weight:bold;font-size:16px}.title-member-count{margin-left:4px;color:#868b94}
  .more-button-wrapper{display:inline-flex;justify-content:center;align-items:center;width:24px;height:24px;color:#212124}
  .scroll{flex:1;overflow-y:auto;padding:12px 16px}
  .for-containment{display:flex;gap:6px;margin:6px 0;align-items:flex-end}
  .for-containment.left{justify-content:flex-start}.for-containment.right{justify-content:flex-end}
  .pf{width:40px;flex:none;align-self:flex-start}.profile-image{width:40px;height:40px;border-radius:14px}
  .nickname{font-size:13px;margin:0 0 4px 2px}
  .message-box{display:inline-flex;margin:0;padding:10px 14px;max-width:260px;font-size:14px;line-height:150%;letter-spacing:-0.02em;border-radius:20px;background:#f2f3f6}
  .meta{display:flex;flex-direction:column;padding:0 2px}.meta.sender{align-items:flex-end}
  .message-date,.unread-text{font-size:12px;color:#868b94}
  form{display:flex;flex-direction:column;justify-content:space-between;margin:16px;border:1px solid #212124;border-radius:8px;height:125px}
  textarea{margin:12px 12px 0;width:calc(100% - 24px);height:63px;border:none;outline:none;resize:none;font-size:14px;font-family:inherit}
  .chatform-option-area{display:flex;justify-content:space-between;margin:8px 10px}
  .chatform-submenu{display:flex;align-items:center;column-gap:12px}
  .option-wrapper{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px}
  .option-wrapper svg{fill:#868b94}
  .chatform-option-area>button{border:0;border-radius:4px;width:64px;height:32px;font-weight:bold;font-size:14px;background:#ff6f0f;color:#fff}
  .chatform-option-area>button.disable{background:#dcdee3}
  .text-length{display:none}
</style></head>
<body>
<div class="shell"><main class="body"><div>
 <section><div class="chat-normal-room">
  <div class="hdr"><div class="group-title"><span>주말 캠핑 모임</span><span class="title-member-count">12</span></div>
   <div><div class="more-button-wrapper"><svg width="4" height="16" viewBox="0 0 4 16"><circle cx="2" cy="2" r="1.3" fill="currentColor"/><circle cx="2" cy="8" r="1.3" fill="currentColor"/><circle cx="2" cy="14" r="1.3" fill="currentColor"/></svg></div></div></div>
  <div class="scroll">
<div class="for-containment left"><div class="pf"><img class="profile-image" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2214%22%20fill%3D%22%23f4a261%22%2F%3E%3Ctext%20x%3D%2220%22%20y%3D%2226%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22sans-serif%22%3E%EC%BA%A0%3C%2Ftext%3E%3C%2Fsvg%3E" alt=""></div><div class="message-wrapper"><div class="nickname">캠핑요정</div><div><p class="message-box">이번 주말 날씨 괜찮대요!</p></div></div><div class="meta"><div class="message-date">오전 9:41</div></div></div>
<div class="for-containment left sequnce-message"><div class="pf" style="visibility:hidden"><img class="profile-image" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2214%22%20fill%3D%22%23f4a261%22%2F%3E%3Ctext%20x%3D%2220%22%20y%3D%2226%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22sans-serif%22%3E%EC%BA%A0%3C%2Ftext%3E%3C%2Fsvg%3E" alt=""></div><div class="message-wrapper"><div><p class="message-box">토요일 아침 9시에 공원 입구에서 만나요</p></div></div><div class="meta"><div class="message-date">오전 9:41</div></div></div>
<div class="for-containment right"><div class="meta sender"><div class="unread-text">3</div><div class="message-date">오전 9:43</div></div><div class="message-wrapper"><div><p class="message-box">좋아요 저 참석할게요 🙌</p></div></div></div>
<div class="for-containment left"><div class="pf"><img class="profile-image" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2214%22%20fill%3D%22%232a9d8f%22%2F%3E%3Ctext%20x%3D%2220%22%20y%3D%2226%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22sans-serif%22%3E%EB%93%B1%3C%2Ftext%3E%3C%2Fsvg%3E" alt=""></div><div class="message-wrapper"><div class="nickname">등산하는곰</div><div><p class="message-box">저도 갈게요. 버너 챙겨갈까요?</p></div></div><div class="meta"><div class="message-date">오전 9:45</div></div></div>
<div class="for-containment right"><div class="meta sender"><div class="unread-text">2</div><div class="message-date">오전 9:46</div></div><div class="message-wrapper"><div><p class="message-box">네 부탁드려요! 저는 의자 4개 가져갈게요</p></div></div></div>
<div class="for-containment left"><div class="pf"><img class="profile-image" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2240%22%20height%3D%2240%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2214%22%20fill%3D%22%238d99ae%22%2F%3E%3Ctext%20x%3D%2220%22%20y%3D%2226%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-family%3D%22sans-serif%22%3E%EC%82%B0%3C%2Ftext%3E%3C%2Fsvg%3E" alt=""></div><div class="message-wrapper"><div class="nickname">산책러버</div><div><p class="message-box">혹시 늦을 수도 있는데 먼저 출발하셔도 돼요</p></div></div><div class="meta"><div class="message-date">오전 9:52</div></div></div>
<div class="for-containment right"><div class="meta sender"><div class="unread-text">1</div><div class="message-date">오전 9:53</div></div><div class="message-wrapper"><div><p class="message-box">넵 위치 공유할게요</p></div></div></div>
  </div>
  <form><textarea placeholder="메시지를 입력해주세요"></textarea>
   <div class="chatform-option-area"><div class="chatform-submenu">
    <label class="option-wrapper"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 4h14v12H3z M5 13l3-4 3 3 2-2 3 3z"/></svg></label>
    <label class="option-wrapper"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/></svg></label>
    <label class="option-wrapper"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 3h9l3 3v11H4z"/></svg></label>
   </div><button type="button" class="disable">전송</button></div>
   <span class="text-length">0/1000</span></form>
 </div></section>
</div></main></div>
<script>
  // chrome 확장 API 흉내: ?theme=…&panel=1&hide=1
  const qs = new URLSearchParams(location.search);
  const state = { skinV2: true, theme: qs.get("theme") || "light", hideAvatars: qs.get("hide") === "1", fontStep: 0, bgColor: null };
  const listeners = [];
  window.chrome = {
    runtime: { sendMessage: (m, cb) => cb({ isPopup: true }), lastError: undefined },
    storage: {
      local: {
        get: async (keys) => { const ks = [].concat(keys); const o = {}; ks.forEach((k) => { if (k in state) o[k] = state[k]; }); return o; },
        set: async (o) => { const ch = {}; for (const k in o) { ch[k] = { newValue: o[k] }; state[k] = o[k]; } listeners.forEach((f) => f(ch, "local")); },
        remove: async () => {},
      },
      onChanged: { addListener: (f) => listeners.push(f) },
    },
  };
</script>
<script src="../../content/selectors.js"></script>
<script src="../../content/theme.js"></script>
<script src="../../content/appearance.js"></script>
<script src="../../content/popup-layout.js"></script>
<script src="../../content/settings-panel.js"></script>
<script src="../../content/popup-controls.js"></script>
<script>
  if (new URLSearchParams(location.search).get("panel") === "1")
    setTimeout(() => document.getElementById("kkt-settings-btn").click(), 300);
</script>
</body></html>
