<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 13px/1.4 -apple-system, "Apple SD Gothic Neo", sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #FF6F0F; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    input[type="url"] { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 6px; background: #FF6F0F; color: #fff; font-weight: 600; cursor: pointer; }
    #msg { margin-top: 8px; font-size: 11px; color: #c00; min-height: 14px; }
    .hint { font-size: 11px; color: #888; margin: 6px 0 0; }
  </style>
</head>
<body>
  <h1>당근톡</h1>
  <label for="url">채팅 주소 (https://chat.daangn.com/…)</label>
  <input id="url" type="url" placeholder="https://chat.daangn.com/room/...">
  <button id="open" type="button">창 열기</button>
  <div id="msg"></div>
  <p class="hint">당근마켓 공식 확장이 아닙니다.</p>
  <script src="popup.js"></script>
</body>
</html>
